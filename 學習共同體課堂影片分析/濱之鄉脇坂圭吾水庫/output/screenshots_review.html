<!DOCTYPE html>

<style>
  :root{
    --bg:#f7f5f0; --card:#fff; --ink:#2b2a26; --sub:#6b675e;
    --line:#e2ded4; --accent:#7a8b5a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1d1c1a; --card:#26241f; --ink:#eceae4; --sub:#a49f93; --line:#3a372f; --accent:#a3b47c; }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:2rem 1.5rem 4rem;background:var(--bg);color:var(--ink);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
  header{max-width:1200px;margin:0 auto 2rem}
  h1{font-size:1.5rem;margin:0 0 .4rem;letter-spacing:.02em}
  .meta{color:var(--sub);font-size:.9rem}
  .grid{max-width:1200px;margin:0 auto;display:grid;
        grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem}
  figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  figure img{display:block;width:100%;height:auto;background:#000}
  figcaption{padding:.75rem .9rem 1rem}
  .no{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);
      font-size:.8rem;letter-spacing:.08em}
  .tc{float:right;font-variant-numeric:tabular-nums;color:var(--sub);font-size:.8rem}
  .desc{margin:.35rem 0 0;font-size:.92rem}
